name: widget_refresh_bridge
description: Native bridge for refreshing VMimerInfoV Android widgets.
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.example.widget_refresh_bridge
        pluginClass: WidgetRefreshBridgePlugin